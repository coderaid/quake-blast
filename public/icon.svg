<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128">
  <!-- Quake Blast app icon: a skyscraper cracked in half, halves leaning apart,
       with an explosion bursting out of the center of the crack. -->
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e6fd0"/>
      <stop offset="0.65" stop-color="#4f9fe0"/>
      <stop offset="1" stop-color="#a9d3ef"/>
    </linearGradient>
    <linearGradient id="bld" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#3b4a63"/>
      <stop offset="1" stop-color="#222b3c"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3b0"/>
      <stop offset="0.4" stop-color="#ff9a2a" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="rr"><rect width="128" height="128" rx="24"/></clipPath>
  </defs>

  <g clip-path="url(#rr)">
    <rect width="128" height="128" fill="url(#sky)"/>

    <!-- jungle ground -->
    <rect y="104" width="128" height="24" fill="#3a5f29"/>
    <rect y="104" width="128" height="5" fill="#46763a"/>

    <!-- left half of the tower, leaning left -->
    <g transform="rotate(-7 42 112)">
      <rect x="49" y="8" width="2" height="14" fill="#151b28"/>
      <path d="M40 112 L40 24 L62 18 L54 32 L64 44 L54 58 L63 72 L55 86 L62 100 L58 112 Z"
            fill="url(#bld)" stroke="#151b28" stroke-width="1.5" stroke-linejoin="round"/>
      <g fill="#9fd0e8">
        <rect x="43" y="28" width="4" height="7"/><rect x="49" y="28" width="4" height="7"/>
        <rect x="43" y="40" width="4" height="7"/><rect x="49" y="40" width="4" height="7" fill="#ffd76a"/>
        <rect x="43" y="52" width="4" height="7" fill="#ffd76a"/><rect x="49" y="52" width="4" height="7"/>
        <rect x="43" y="64" width="4" height="7"/><rect x="49" y="64" width="4" height="7"/>
        <rect x="43" y="76" width="4" height="7"/><rect x="49" y="76" width="4" height="7" fill="#ffd76a"/>
        <rect x="43" y="88" width="4" height="7"/><rect x="49" y="88" width="4" height="7"/>
      </g>
    </g>

    <!-- right half of the tower, leaning right -->
    <g transform="rotate(7 86 112)">
      <path d="M88 112 L88 24 L66 18 L74 32 L64 44 L74 58 L65 72 L73 86 L66 100 L70 112 Z"
            fill="url(#bld)" stroke="#151b28" stroke-width="1.5" stroke-linejoin="round"/>
      <g fill="#9fd0e8">
        <rect x="81" y="28" width="4" height="7" fill="#ffd76a"/><rect x="75" y="28" width="4" height="7"/>
        <rect x="81" y="40" width="4" height="7"/><rect x="75" y="40" width="4" height="7"/>
        <rect x="81" y="52" width="4" height="7"/><rect x="75" y="52" width="4" height="7" fill="#ffd76a"/>
        <rect x="81" y="64" width="4" height="7"/><rect x="75" y="64" width="4" height="7"/>
        <rect x="81" y="76" width="4" height="7" fill="#ffd76a"/><rect x="75" y="76" width="4" height="7"/>
        <rect x="81" y="88" width="4" height="7"/><rect x="75" y="88" width="4" height="7"/>
      </g>
    </g>

    <!-- ground crack under the split -->
    <polygon points="56,112 72,112 64,126" fill="#1c2415"/>
    <path d="M64 112 L60 118 L66 124 L62 128" stroke="#1c2415" stroke-width="2.5" fill="none" stroke-linecap="round"/>

    <!-- dust puffs at the base -->
    <circle cx="38" cy="108" r="7" fill="#c9c2b4" opacity="0.7"/>
    <circle cx="90" cy="109" r="6" fill="#c9c2b4" opacity="0.7"/>

    <!-- explosion bursting from the center of the crack -->
    <circle cx="64" cy="60" r="30" fill="url(#glow)"/>
    <polygon fill="#ff7a1a" points="90,60 74.2,55.8 82.4,41.6 68.2,49.8 64,34 59.8,49.8 45.6,41.6 53.8,55.8 38,60 53.8,64.2 45.6,78.4 59.8,70.2 64,86 68.2,70.2 82.4,78.4 74.2,64.2"/>
    <polygon fill="#ffd23e" points="78.8,53.9 69,55.1 70.1,45.2 64,53 57.9,45.2 59,55.1 49.2,53.9 57,60 49.2,66.1 59,64.9 57.9,74.8 64,67 70.1,74.8 69,64.9 78.8,66.1 71,60"/>
    <circle cx="64" cy="60" r="6" fill="#fff8e0"/>

    <!-- flying debris -->
    <rect x="30" y="46" width="5" height="4" fill="#222b3c" transform="rotate(24 32 48)"/>
    <rect x="94" y="50" width="5" height="4" fill="#222b3c" transform="rotate(-30 96 52)"/>
    <rect x="46" y="28" width="4" height="4" fill="#222b3c" transform="rotate(40 48 30)"/>
    <rect x="82" y="30" width="4" height="4" fill="#222b3c" transform="rotate(-18 84 32)"/>
  </g>
</svg>
